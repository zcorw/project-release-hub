name: Publish approved image
# Manual publishing only. This workflow never connects to a VPS.
# Public or private source repositories may publish a private GHCR package.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/check.yml
  publish:
    needs: checks
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Derive the image target from this repository
        id: target
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          repository="${REPOSITORY,,}"
          owner="${repository%/*}"
          package="${repository#*/}"
          [[ "$owner" =~ ^[a-z0-9-]+$ ]]
          [[ "$package" =~ ^[a-z0-9._-]+$ ]]
          if [ "$OWNER_TYPE" = Organization ]; then scope=orgs; else scope=users; fi
          printf 'image=ghcr.io/%s\n' "$repository" >>"$GITHUB_OUTPUT"
          printf 'package_api=%s/%s/packages/container/%s\n' "$scope" "$owner" "$package" >>"$GITHUB_OUTPUT"
      - name: Refuse an existing public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_API: ${{ steps.target.outputs.package_api }}
        run: |
          set -euo pipefail
          set +e
          gh api "$PACKAGE_API" --jq .visibility >package-visibility.txt 2>package-error.txt
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            test "$(cat package-visibility.txt)" = private
          elif ! grep -q '(HTTP 404)' package-error.txt; then
            echo 'Could not verify package visibility; publication blocked.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published commit tag
        env:
          IMAGE: ${{ steps.target.outputs.image }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          set +e
          docker buildx imagetools inspect "$IMAGE" >existing-image.txt 2>inspect-error.txt
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'This commit tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          if grep -Eiq 'unauthorized|denied|timeout|no such host|connection refused' inspect-error.txt || ! grep -Eiq 'manifest unknown|not found' inspect-error.txt; then
            echo 'Could not confirm tag absence; publication blocked.' >&2
            exit 1
          fi
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.target.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Zhixu (知序)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s\n' "$IMAGE" "$DIGEST" >image-reference.txt
          printf 'Validated commit: `%s`\n\nImage: `%s@%s`\n\nNo deployment was performed.\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: image-reference-${{ github.sha }}
          path: image-reference.txt
          if-no-files-found: error
